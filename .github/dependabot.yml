version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns: ["*"]

  # requirements.txt / requirements-dev.txt pin the seven in-repo packages and their
  # exact runtime dependencies; scripts/check.py and the CI no-pypi-fallback job assert
  # those seven names stay unregistered on the public index. A routine Dependabot pip PR
  # would either try to bump a sibling pin out of lockstep with pyproject.toml (breaking
  # the exact-pin invariant scripts/check.py enforces) or bump a runtime dependency the
  # upstream release was never tested against. Upstream owns this file; a version bump
  # is upstream's call, not a Dependabot PR on this fork. GitHub's security-advisory
  # alerts (Dependabot alerts / security updates) are independent of this setting and
  # still fire regardless of open-pull-requests-limit.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 0
    labels: ["dependencies", "python"]

  # examples/package-lock.json is the shared npm workspace lockfile for the eight
  # example web apps; it is upstream product content, upgraded (or not) alongside the
  # verticals it ships with. Same reasoning as pip above: routine bumps are upstream's
  # call, not a Dependabot PR here. Security updates still fire independently.
  - package-ecosystem: "npm"
    directory: "/examples"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 0
    labels: ["dependencies", "npm"]
